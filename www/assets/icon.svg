<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 120 120">
<defs>
  <radialGradient id="bg" cx="50%" cy="44%" r="72%"><stop offset="0" stop-color="#121b36"/><stop offset=".55" stop-color="#070b18"/><stop offset="1" stop-color="#020307"/></radialGradient>
  <radialGradient id="gw" cx="50%" cy="58%" r="40%"><stop offset="0" stop-color="#f2a144" stop-opacity=".42"/><stop offset=".6" stop-color="#f2a144" stop-opacity=".08"/><stop offset="1" stop-color="#f2a144" stop-opacity="0"/></radialGradient>
  <linearGradient id="v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#ffd9a0"/><stop offset="1" stop-color="#f2a144"/></linearGradient>
  <linearGradient id="vs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="r1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2a144" stop-opacity="0"/><stop offset=".3" stop-color="#f2a144" stop-opacity=".9"/><stop offset=".72" stop-color="#ffd9a0"/><stop offset="1" stop-color="#f2a144" stop-opacity=".15"/></linearGradient>
  <linearGradient id="r2" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#a9dcff" stop-opacity="0"/><stop offset=".35" stop-color="#a9dcff" stop-opacity=".85"/><stop offset=".75" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#a9dcff" stop-opacity=".1"/></linearGradient>
  <filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5"/></filter>
</defs>
<rect width="120" height="120" fill="url(#bg)"/>
