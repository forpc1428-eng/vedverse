  <g fill="#fff"><circle cx="18" cy="44" r=".6" opacity=".7"/><circle cx="104" cy="44" r=".5" opacity=".6"/><circle cx="34" cy="16" r=".45" opacity=".6"/><circle cx="76" cy="104" r=".55" opacity=".55"/><circle cx="12" cy="70" r=".4" opacity=".5"/><circle cx="108" cy="72" r=".45" opacity=".5"/><circle cx="48" cy="106" r=".4" opacity=".45"/><circle cx="66" cy="12" r=".5" opacity=".6"/></g>
