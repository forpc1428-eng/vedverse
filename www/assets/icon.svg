  <circle cx="99.5" cy="60.7" r="2.7" fill="#fff" filter="url(#gl)"/>
  <path transform="translate(91 21) scale(1.15)" opacity="1" d="M0-7 C.5-1.6 1.6-.5 7 0 C1.6 .5 .5 1.6 0 7 C-.5 1.6 -1.6 .5 -7 0 C-1.6-.5 -.5-1.6 0-7Z" fill="#fff"/><path transform="translate(23 25) scale(0.6)" opacity="0.9" d="M0-7 C.5-1.6 1.6-.5 7 0 C1.6 .5 .5 1.6 0 7 C-.5 1.6 -1.6 .5 -7 0 C-1.6-.5 -.5-1.6 0-7Z" fill="#fff"/><path transform="translate(102 95) scale(0.5)" opacity="0.8" d="M0-7 C.5-1.6 1.6-.5 7 0 C1.6 .5 .5 1.6 0 7 C-.5 1.6 -1.6 .5 -7 0 C-1.6-.5 -.5-1.6 0-7Z" fill="#fff"/><path transform="translate(17 92) scale(0.42)" opacity="0.7" d="M0-7 C.5-1.6 1.6-.5 7 0 C1.6 .5 .5 1.6 0 7 C-.5 1.6 -1.6 .5 -7 0 C-1.6-.5 -.5-1.6 0-7Z" fill="#fff"/>
